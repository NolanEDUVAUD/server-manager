[package]
name = "server-manager"
version = "0.3.0"
description = "Server Power Manager - Gestionnaire d'alimentation de serveurs homelab"
authors = []
edition = "2021"

[lib]
name = "server_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "server-manager"
path = "src/main.rs"
# `main.rs` has no unit tests of its own, so there is nothing to run its own
# test harness for; disabling it avoids building an extra, pointless
# executable during `cargo test`.
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# SSH pure Rust (pas d'OpenSSL/CMake requis)
# russh ≥ 0.60.3 : corrige RUSTSEC-2026-0153/0154 (allocations non bornées). russh-keys est
# intégré (`russh::keys`, clés `ssh_key` 0.7 avec prise en charge des .ppk) ; moteur `ring`
# (déjà présent dans l'arbre) plutôt qu'aws-lc-rs (CMake/NASM).
russh = { version = "0.63", default-features = false, features = ["flate2", "rsa", "ring"] }

# Chiffrement AES-256-GCM pour les mots de passe
aes-gcm = "0.10"
# serde : les phrases de passe reçues du frontend sont désérialisées directement en Zeroizing
zeroize = { version = "1", features = ["serde"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"

# UUID pour les identifiants uniques
uuid = { version = "1", features = ["v4"] }

# Futures pour le parallelisme (ping_all, etc.)
futures = "0.3"

# Logging
log = "0.4"
env_logger = "0.11"

# Gestion d'erreurs
thiserror = "1"

tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# Ouverture du navigateur par défaut (releases GitHub, rapport de bug, soutien du projet) :
# l'adresse autorisée est restreinte dans tauri.conf.json (plugins.shell.open)
tauri-plugin-shell = "2"
# Mise à jour automatique signée (minisign) depuis les releases GitHub. Sans la
# fonctionnalité « zip » : elle ne sert qu'aux paquets de mise à jour du format Tauri v1.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
chrono = { version = "0.4", features = ["serde"] }

# Client HTTP pour l'intégration Proxmox VE
reqwest = { version = "0.12", features = ["json"] }
keyring = { version = "3", features = ["windows-native"] }
tokio-native-tls = "0.3"
x509-parser = "0.16"

# Base locale de l'historique (SQLite compilé dans le binaire, sans DLL)
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache"] }
# Verrouillage de l'application : Argon2id (RustCrypto, même génération que
# aes-gcm 0.10 / sha2 0.10) pour le mot de passe maître et le hash du PIN
argon2 = { version = "0.5", features = ["std", "zeroize"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# Windows Hello (UserConsentVerifier) et état de la session (WTS) : même version
# que celle déjà tirée par Tauri, pour ne pas compiler deux fois la crate
windows = { version = "0.61", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_System_RemoteDesktop", "Win32_System_WinRT"] }
windows-future = "0.2"
# Détection de Pageant (fenêtre WM_COPYDATA) : même version que celle tirée par russh 0.63
pageant = "0.2"

[dev-dependencies]
wiremock = "0.6"
# Tests des clés SSH (vecteurs .ppk construits dans les tests avec l'argon2 0.5 du projet,
# clés RSA / OpenSSH chiffrées) :
# mêmes versions que celles de ssh-key 0.7 / russh 0.63, aucune crate nouvelle dans l'arbre.
rand_ssh = { package = "rand", version = "0.10" }
sha1 = "0.11"

# Argon2id (64 Mio) est très lent sans optimisation : tests et `tauri dev`
# restent réactifs en optimisant ces deux crates même en profil dev
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
