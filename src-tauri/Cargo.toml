[package]
name = "server-manager"
version = "0.1.0"
description = "Server Power Manager - Gestionnaire d'alimentation de serveurs homelab"
authors = []
edition = "2021"

[lib]
name = "server_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# SSH pure Rust (pas d'OpenSSL/CMake requis)
# russh 0.44 : client inclus par defaut, pas de feature "client" separee
russh = "0.44"
russh-keys = "0.44"
async-trait = "0.1"

# Chiffrement AES-256-GCM pour les mots de passe
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"

# UUID pour les identifiants uniques
uuid = { version = "1", features = ["v4"] }

# Futures pour le parallelisme (ping_all, etc.)
futures = "0.3"

# Logging
log = "0.4"
env_logger = "0.11"

# Gestion d'erreurs
thiserror = "1"

tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
chrono = { version = "0.4", features = ["serde"] }

# Client HTTP pour l'intégration Proxmox VE
reqwest = { version = "0.12", features = ["json"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
wiremock = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
